<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha IA Staff — Acesso Protegido</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0d10;
      color: #e4e6eb;
      font-family: 'Newsreader', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(20, 24, 33, 0.8), #07080a 80%);
      z-index: 0;
    }
    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: rgba(15, 18, 23, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
    }
    .seal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #b91c1c;
      background: rgba(185, 28, 28, 0.1);
      border: 1px solid rgba(185, 28, 28, 0.25);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #f1f3f7;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 14px;
      line-height: 1.5;
      color: #8b92a0;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #a0a6b5;
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: rgba(8, 10, 13, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 12px 42px 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #f1f3f7;
      transition: all 0.2s ease;
      outline: none;
    }
    input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pwd:hover { color: #d1d5db; }
    .btn-submit {
      width: 100%;
      background: #141820;
      color: #f3f4f6;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 13px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover:not(:disabled) {
      background: #dc2626;
      border-color: #dc2626;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.35);
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 12px;
      color: #6b7280;
    }
    .remember-wrap input[type="checkbox"] {
      accent-color: #dc2626;
      cursor: pointer;
    }
    .msg-box {
      margin-top: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 10px 12px;
      border-radius: 6px;
      display: none;
      line-height: 1.4;
    }
    .msg-error {
      background: rgba(185, 28, 28, 0.12);
      border: 1px solid rgba(185, 28, 28, 0.3);
      color: #f87171;
    }
    .msg-loading {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
    .footer-note {
      margin-top: 26px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #4b5563;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="seal">［ 密 ］ AES-256-GCM & PBKDF2</div>
    <h1>Trilha IA Staff</h1>
    <p class="desc">Este ambiente contém arquiteturas de alto valor e pesquisa proprietária. Insira a chave de liberação para descriptografar o conteúdo.</p>

    <form id="authForm" onsubmit="event.preventDefault(); handleUnlock();">
      <div class="form-group">
        <label for="pwdInput">Chave de Descriptografia</label>
        <div class="input-wrap">
          <input type="password" id="pwdInput" placeholder="Digite a chave secreta..." autocomplete="current-password" autofocus required>
          <button type="button" class="toggle-pwd" id="toggleBtn" onclick="toggleVisibility()" title="Mostrar/Ocultar">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>Desbloquear Ambiente</span>
      </button>

      <div class="remember-wrap">
        <input type="checkbox" id="rememberSession" checked>
        <label for="rememberSession" style="margin: 0; text-transform: none; font-size: 12px; cursor: pointer;">Lembrar nesta sessão do navegador</label>
      </div>

      <div id="msgBox" class="msg-box"></div>
    </form>

    <div class="footer-note">Criptografia em repouso de ponta a ponta · Zero Plaintext Exposto</div>
  </div>

    };

    let failAttempts = 0;
    const SESSION_KEY = "trilha_staff_vault_key";

    function showMsg(text, type) {
      const box = document.getElementById("msgBox");
      box.textContent = text;
      box.className = "msg-box " + (type === "error" ? "msg-error" : "msg-loading");
      box.style.display = "block";
    }

    function toggleVisibility() {
      const inp = document.getElementById("pwdInput");
      inp.type = inp.type === "password" ? "text" : "password";
    }

    async function deriveAndDecrypt(pwd) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(PAYLOAD.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(PAYLOAD.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(PAYLOAD.data), c => c.charCodeAt(0));

      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(pwd),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const aesKey = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: PAYLOAD.iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        aesKey,
        data
      );

      return new TextDecoder().decode(decrypted);
    }

    async function handleUnlock(presetPwd) {
      const pwdInput = document.getElementById("pwdInput");
      const submitBtn = document.getElementById("submitBtn");
      const remember = document.getElementById("rememberSession")?.checked ?? true;
      const pwd = presetPwd || pwdInput.value;

      if (!pwd) return;

      submitBtn.disabled = true;
      showMsg("Derivando chave PBKDF2 (100k iterações) e autenticando...", "loading");

      // Anti brute-force delay
      const delayMs = Math.min(failAttempts * 1200, 5000);
      if (delayMs > 0 && !presetPwd) {
        await new Promise(r => setTimeout(r, delayMs));
      }

      try {
        const decryptedHtml = await deriveAndDecrypt(pwd);

        if (remember) {
          try { sessionStorage.setItem(SESSION_KEY, pwd); } catch(e) {}
        }

        // Successfully decrypted! Wipe security gate and render full app
        document.open();
        document.write(decryptedHtml);
        document.close();

        // Inject Lock button in header once DOM boots
        setTimeout(() => {
          const header = document.querySelector("header .max-w-7xl, header div, header");
          if (header) {
            const lockBtn = document.createElement("button");
            lockBtn.innerHTML = "🔒 Bloquear";
            lockBtn.className = "px-3 py-1 text-xs border border-red-500/30 text-red-400 hover:bg-red-500/10 rounded transition font-mono";
            lockBtn.onclick = () => {
              sessionStorage.removeItem(SESSION_KEY);
              location.reload();
            };
            header.appendChild(lockBtn);
          }
        }, 300);

      } catch (err) {
        failAttempts++;
        submitBtn.disabled = false;
        showMsg("Falha na autenticação: Chave incorreta ou assinatura corrompida.", "error");
        if (pwdInput) {
          pwdInput.value = "";
          pwdInput.focus();
        }
      }
    }

    // Auto-login from sessionStorage if already unlocked in this browser session
    window.addEventListener("DOMContentLoaded", () => {
      try {
        const saved = sessionStorage.getItem(SESSION_KEY);
        if (saved) {
          handleUnlock(saved);
        }
      } catch(e) {}
    });
  </script>

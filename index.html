<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>·</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0d10;
      min-height: 100vh;
      display: flex;
      position: relative;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(20, 24, 33, 0.9), #07080a 85%);
      z-index: 0;
    }

    /* Stealth login box in top-left corner */
    .stealth-gate {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 18, 23, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      padding: 4px 6px 4px 10px;
      border-radius: 8px;
      transition: all 0.25s ease;
      opacity: 0.85;
    }
    .stealth-gate:hover, .stealth-gate:focus-within {
      opacity: 1;
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(15, 18, 23, 0.9);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .stealth-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #dc2626;
      box-shadow: 0 0 8px rgba(220, 38, 38, 0.8);
      transition: background 0.2s ease;
      flex-shrink: 0;
    }
    .stealth-input {
      background: transparent;
      border: none;
      outline: none;
      color: #f1f3f7;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      width: 140px;
      padding: 4px 2px;
      letter-spacing: 0.05em;
    }
    .stealth-input::placeholder {
      color: #4b5563;
      font-size: 11px;
    }
    .stealth-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #9ca3af;
      cursor: pointer;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 5px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stealth-btn:hover {
      background: rgba(220, 38, 38, 0.15);
      border-color: rgba(220, 38, 38, 0.3);
      color: #f87171;
    }
    .stealth-gate.error {
      animation: shake 0.35s ease;
      border-color: rgba(220, 38, 38, 0.6) !important;
    }
    .stealth-gate.error .stealth-dot {
      background: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
  </style>
</head>
<body>

  <!-- Minimal stealth trigger/input in top-left corner -->
  <form id="gateForm" class="stealth-gate" onsubmit="event.preventDefault(); unlock();">
    <div class="stealth-dot" id="dot"></div>
    <input type="password" id="p" class="stealth-input" placeholder="acesso..." autocomplete="current-password" autofocus required>
    <button type="submit" class="stealth-btn" id="subBtn" title="Entrar">">→</button>
  </form>

      const iv = Uint8Array.from(atob(PAYLOAD.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(PAYLOAD.data), c => c.charCodeAt(0));

      const baseKey = await crypto.subtle.importKey(
        "raw",
        enc.encode(pwd),
        "PBKDF2",
        false,
        ["deriveKey"]
      );

      const aesKey = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: PAYLOAD.iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv },
        aesKey,
        data
      );

      return new TextDecoder().decode(decrypted);
    }

    async function unlock(presetPwd) {
      if (busy) return;
      const inp = document.getElementById("p");
      const box = document.getElementById("gateForm");
      const dot = document.getElementById("dot");
      const pwd = presetPwd || inp?.value;
      if (!pwd) return;

      busy = true;
      if (dot) dot.style.background = "#eab308";

      try {
        const html = await deriveAndDecrypt(pwd);
        try { sessionStorage.setItem(SESSION_KEY, pwd); } catch(e) {}
        
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        busy = false;
        if (dot) dot.style.background = "#dc2626";
        if (box) {
          box.classList.add("error");
          setTimeout(() => box.classList.remove("error"), 400);
        }
        if (inp) {
          inp.value = "";
          inp.focus();
        }
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      try {
        const saved = sessionStorage.getItem(SESSION_KEY);
        if (saved) unlock(saved);
      } catch(e) {}
    });
  </script>
